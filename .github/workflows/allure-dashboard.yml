name: Allure Dashboard

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test-and-publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright browsers
        run: playwright install --with-deps chromium

      # CI=true is set by GitHub Actions, which is what conftest.py checks to
      # launch Chromium headless. --clean-alluredir avoids stale results from a
      # previous run being counted as duplicate/flaky test executions.
      - name: Run tests
        run: pytest --clean-alluredir
        continue-on-error: true # still publish a dashboard on red builds

      - name: Restore dashboard history
        uses: actions/cache@v4
        with:
          path: dashboard-history
          key: allure-dashboard-history-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            allure-dashboard-history-${{ github.ref_name }}-

      # Predicted ahead of the deploy so the traceability matrix's dashboard-url
      # is already correct when it's generated below (deploy-pages only knows the
      # real URL after the upload, but this repo has no custom domain, so the
      # default project-Pages URL is exact).
      - name: Compute Pages URL
        id: pages-url
        run: echo "url=https://${{ github.repository_owner }}.github.io/${GITHUB_REPOSITORY#*/}/" >> "$GITHUB_OUTPUT"

      - name: Generate Allure dashboard
        id: dashboard
        uses: pranesh517/allure_dashboards@v2
        with:
          allure-results-path: allure-results
          history-path: dashboard-history
          dashboard-title: HRM UI Tests

      - name: Save dashboard history
        run: |
          rm -rf dashboard-history
          cp -r allure-dashboard/data dashboard-history

      # This repo has no dedicated requirement/ticket id on tests, only
      # @allure.epic("OrangeHRM") / @allure.feature("Authentication") (see
      # tests/test_login.py) - so requirement-annotation is pointed straight at
      # "feature" (the closer analog to a requirement) instead of a custom
      # label. See the traceability action's README, "No dedicated requirement
      # id? Point it at epic, feature, or story" for what that changes vs. a
      # real requirement id. Add requirements-file: requirements.csv later if
      # you start maintaining a master feature/requirement list - without one,
      # coverage is measured against whichever @allure.feature values show up
      # in this run's results.
      - name: Generate traceability matrix
        id: matrix
        uses: pranesh517/allure_dashboards/traceability@v2
        with:
          allure-results-path: allure-results
          output-path: allure-dashboard/traceability
          requirement-annotation: feature
          requirement-source: label
          dashboard-url: ${{ steps.pages-url.outputs.url }}
          title: HRM UI Tests — Traceability Matrix

      - uses: actions/upload-pages-artifact@v3
        with:
          path: allure-dashboard

      - id: deployment
        uses: actions/deploy-pages@v4

      - name: Summary
        run: |
          echo "### Allure results" >> "$GITHUB_STEP_SUMMARY"
          echo "- Pass rate: ${{ steps.dashboard.outputs.pass-rate }}%" >> "$GITHUB_STEP_SUMMARY"
          echo "- Total: ${{ steps.dashboard.outputs.total }} · Failed: ${{ steps.dashboard.outputs.failed }} · Flaky: ${{ steps.dashboard.outputs.flaky-count }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Dashboard: ${{ steps.deployment.outputs.page_url }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Traceability matrix: ${{ steps.deployment.outputs.page_url }}traceability/ (coverage ${{ steps.matrix.outputs.coverage-percent }}%, ${{ steps.matrix.outputs.covered-requirements }}/${{ steps.matrix.outputs.total-requirements }} features, ${{ steps.matrix.outputs.orphan-tests }} orphan tests)" >> "$GITHUB_STEP_SUMMARY"
